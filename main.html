    const IconCpu = ({ className = "w-5 h-5" }) => (

        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 3v2m6-2v2M9 19v2m6-2v2M3 9h2m-2 6h2m14-6h2m-2 6h2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z" />
      </svg>
    );

    // --- REUSABLE COMPONENTS ---

    // 1. ContactButton Component
    const ContactButton = ({ label = "Contact Me", onClick }) => {
      return (
        <button
          onClick={onClick}
          className="group relative inline-flex items-center justify-center overflow-hidden rounded-full font-kanit font-medium uppercase tracking-widest text-white transition-all duration-300 hover:scale-105 active:scale-95 px-8 py-3 sm:px-10 sm:py-3.5 md:px-12 md:py-4 text-xs sm:text-sm md:text-base cursor-pointer z-20"
          style={{

    // 2. LiveProjectButton Component
    const LiveProjectButton = ({ label = "Live Project", href = "#" }) => {
      return (
        <a
          href={href}
          target="_blank"

          className="inline-flex items-center gap-2 rounded-full border-2 border-[#D7E2EA] px-6 py-2.5 sm:px-8 sm:py-3 text-xs sm:text-sm md:text-base font-kanit font-medium uppercase tracking-widest text-[#D7E2EA] transition-all duration-300 hover:bg-[#D7E2EA]/10 hover:border-white hover:text-white"
        >
          <span>{label}</span>
          <IconArrowUpRight className="w-4 h-4" />
        </a>
      );
    };

    // 3. FadeIn Component
    const FadeIn = ({ children, delay = 0, duration = 0.7, x = 0, y = 30, className = "" }) => {
      return (
        <motion.div
          initial={{ opacity: 0, x, y }}
          whileInView={{ opacity: 1, x: 0, y: 0 }}
          viewport={{ once: true, margin: "50px" }}
          transition={{
            duration,
            delay,
            ease: [0.25, 0.1, 0.25, 1]
          }}
          className={className}
        >
          {children}
        </motion.div>
      );
    };

    // 4. Magnet Component
    const Magnet = ({
      children,
      padding = 150,
      strength = 3,
      activeTransition = "transform 0.3s ease-out",
      inactiveTransition = "transform 0.6s ease-in-out",
      className = ""
    }) => {
      const ref = useRef(null);
      const [position, setPosition] = useState({ x: 0, y: 0 });
      const [isHovered, setIsHovered] = useState(false);

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!ref.current) return;
          const rect = ref.current.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;

          const distanceX = e.clientX - centerX;
          const distanceY = e.clientY - centerY;
          const distance = Math.sqrt(distanceX * distanceX + distanceY * distanceY);

          if (distance < padding + rect.width / 2) {
            setIsHovered(true);
            setPosition({
              x: distanceX / strength,
              y: distanceY / strength
            });
          } else {
            setIsHovered(false);
            setPosition({ x: 0, y: 0 });
          }
        };

        window.addEventListener('mousemove', handleMouseMove);
        return () => window.removeEventListener('mousemove', handleMouseMove);
      }, [padding, strength]);

      return (
        <div
          ref={ref}
          className={className}
          style={{
            transform: `translate3d(${position.x}px, ${position.y}px, 0)`,
            transition: isHovered ? activeTransition : inactiveTransition,
            willChange: 'transform'
          }}
        >
          {children}
        </div>
      );
    };

    // 5. AnimatedText Component (Scroll Reveal)
    const AnimatedText = ({ text }) => {
      const containerRef = useRef(null);
      const { scrollYProgress } = useScroll({
        target: containerRef,
        offset: ['start 0.8', 'end 0.2']
      });

      const characters = useMemo(() => text.split(''), [text]);

      return (
        <p ref={containerRef} className="text-[#D7E2EA] font-kanit font-medium text-center leading-relaxed max-w-[560px] text-[clamp(1rem,2vw,1.35rem)] flex flex-wrap justify-center">
          {characters.map((char, index) => {
            const start = index / characters.length;
            const end = start + (1 / characters.length);
            // Character opacity maps strictly from 0.2 to 1 based on scroll position
            const opacity = useTransform(scrollYProgress, [start, end], [0.2, 1]);

            return (
              <motion.span key={index} style={{ opacity }} className="relative inline-block">
                {char === ' ' ? '\u00A0' : char}
              </motion.span>
            );
          })}
        </p>
      );
    };

    // --- MAIN SECTIONS ---

    // SECTION 1: HERO SECTION

            <Magnet padding={150} strength={3}>

                <img
                  src="https://shrug-person-78902957.figma.site/_components/v2/d24c01ad3a56fc65e942a1f501eb73db42d7cf9a/Rectangle_40443.81459862.png"
                  alt="Jack - 3D Creator Portrait"
                  className="w-[280px] sm:w-[360px] md:w-[440px] lg:w-[520px] object-contain drop-shadow-[0_20px_50px_rgba(220,38,38,0.2)] transition-transform duration-500 group-hover:scale-105"
                  loading="eager"
                />
                {/* GMT Visual Accent Ring */}
                <div className="absolute inset-0 border border-[#DC2626]/20 rounded-full scale-110 pointer-events-none animate-ping opacity-25" />
              </div>
            </Magnet>
          </FadeIn>

          {/* Bottom Bar Layout */}
          <div className="w-full max-w-7xl mx-auto flex justify-between items-end z-20">
            <FadeIn delay={0.35} y={20}>
              <p className="text-[#D7E2EA] font-kanit font-light uppercase tracking-wide leading-snug text-[clamp(0.75rem,1.4vw,1.5rem)] max-w-[160px] sm:max-w-[220px] md:max-w-[260px]">

              </p>
            </FadeIn>

            <FadeIn delay={0.5} y={20}>
              <ContactButton label="Contact Me" onClick={onContactClick} />
            </FadeIn>
          </div>
        </section>
      );
    };

    // SECTION 2: MARQUEE SECTION
    const MarqueeSection = () => {

      const gifUrls = [
        "https://motionsites.ai/assets/hero-space-voyage-preview-eECLH3Yc.gif",
        "https://motionsites.ai/assets/hero-codenest-preview-Cgppc2qV.gif",
        "https://motionsites.ai/assets/hero-vex-ventures-preview-BczMFIiw.gif",

        "https://motionsites.ai/assets/hero-terra-preview-BFjrCr7T.gif",
        "https://motionsites.ai/assets/hero-skyelite-preview-DHaZIgUv.gif",
        "https://motionsites.ai/assets/hero-aethera-preview-DknSlcTa.gif",
        "https://motionsites.ai/assets/hero-designpro-preview-D8c5_een.gif",
        "https://motionsites.ai/assets/hero-stellar-ai-preview-D3HL6bw1.gif",

        "https://motionsites.ai/assets/hero-orbit-web3-preview-BXt4OttD.gif",

      const row1Gifs = useMemo(() => {
        const row1 = gifUrls.slice(0, 11);
        return [...row1, ...row1, ...row1]; // Tripled for continuous scroll

          const rect = sectionRef.current.getBoundingClientRect();
          const sectionTop = rect.top + window.scrollY;
          const calculated = (window.scrollY - sectionTop + window.innerHeight) * 0.3;
          setScrollOffset(calculated);

        window.addEventListener('scroll', handleScroll, { passive: true });
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      return (
        <section ref={sectionRef} className="bg-[#0C0C0C] pt-24 sm:pt-32 md:pt-40 pb-10 overflow-hidden relative z-10">
          <div className="flex flex-col gap-3">
            
            {/* Row 1: Moves RIGHT on scroll */}

                transform: `translateX(${scrollOffset - 200}px)`,

              ))}
            </div>

            {/* Row 2: Moves LEFT on scroll */}
            <div
              className="flex gap-3 w-max"
              style={{
                transform: `translateX(${-(scrollOffset - 200)}px)`,
                willChange: 'transform'
              }}
            >
              {row2Gifs.map((url, i) => (
                <div key={`row2-${i}`} className="w-[280px] sm:w-[360px] md:w-[420px] h-[180px] sm:h-[230px] md:h-[270px] flex-shrink-0 rounded-2xl overflow-hidden bg-[#15171C] border border-white/5 shadow-2xl group relative">
                  <img src={url} alt={`3D Motion Preview ${i}`} className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" loading="lazy" />
                  <div className="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300" />

    };

            <img
              src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/p59_1.4659672e.png"

              className="w-[100px] sm:w-[140px] md:w-[180px] object-contain drop-shadow-[0_10px_30px_rgba(0,0,0,0.8)]"
            />
          </FadeIn>

          {/* Top-Right: Lego Icon */}

            <img
              src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/lego_icon-1.703bb594.png"

            <img
              src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/Group_134-1.2e04f3ce.png"
              alt="3D Visual Group"
              className="w-[130px] sm:w-[170px] md:w-[220px] object-contain drop-shadow-[0_10px_30px_rgba(0,0,0,0.8)]"
            />
          </FadeIn>

          {/* Center Column Container */}
          <div className="flex flex-col items-center justify-center max-w-4xl z-10 w-full text-center">
            
            {/* Heading */}
            <FadeIn delay={0} y={40} className="mb-10 sm:mb-14 md:mb-16">
              <h2 className="hero-heading font-kanit font-black uppercase tracking-tight leading-none text-[clamp(3rem,12vw,160px)]">
                About me
              </h2>
            </FadeIn>

            {/* Character-by-character animated scroll reveal paragraph */}

              <AnimatedText text={bioText} />
            </div>

            {/* Contact Button */}
            <FadeIn delay={0.2} y={20}>
              <ContactButton label="Contact Me" onClick={onContactClick} />
            </FadeIn>

          </div>
        </section>
      );
    };

    // SECTION 4: SERVICES SECTION
    const ServicesSection = () => {
      const services = [
        {
          num: "01",
          title: "3D Modeling",
          desc: "Creation of detailed objects, characters, or environments tailored to specific client needs, ideal for games, products, and visualizations."
        },
        {
          num: "02",
          title: "Rendering",
          desc: "High-quality, photorealistic renders that showcase designs with custom lighting, textures, and materials to bring concepts to life."
