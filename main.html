<body class="bg-[#FAFAFA] text-[#141414] antialiased selection:bg-[#DC2626] selection:text-white">

  <script type="text/babel">
    const { useRef, useState, useEffect } = React;
    const { motion, useInView, AnimatePresence } = window.Motion;

    // Helper Component: Animated Fade In
    const FadeIn = ({ children, delay = 0, y = 20, className = "" }) => {
      const ref = useRef(null);
      const isInView = useInView(ref, { once: true, margin: "-50px" });

      return (
        <motion.div
          ref={ref}
          initial={{ opacity: 0, y: y }}
          animate={isInView ? { opacity: 1, y: 0 } : { opacity: 0, y: y }}
          transition={{ duration: 0.8, delay: delay, ease: [0.16, 1, 0.3, 1] }}
          className={className}
        >
          {children}
        </motion.div>
      );
    };

    const Navigation = () => {
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      return (
        <header className="sticky top-0 z-40 bg-[#FAFAFA]/90 backdrop-blur-md border-b border-black/10 px-6 md:px-12 py-4">
          <div className="max-w-7xl mx-auto flex justify-between items-center">
            <a href="#" className="font-grotesk font-bold text-2xl tracking-tighter text-[#141414] hover:text-[#DC2626] transition-colors">

              <a href="#projects" className="px-3.5 py-2 rounded-full hover:bg-black/5 transition-all">Projects</a>
              <a href="#skills" className="px-3.5 py-2 rounded-full hover:bg-black/5 transition-all">Skills</a>
              <a href="#certifications" className="px-3.5 py-2 rounded-full hover:bg-black/5 transition-all">Certifications</a>
              <a href="#contact" className="px-3.5 py-2 rounded-full hover:bg-black/5 transition-all">Contact</a>
              
              <div className="h-4 w-[1px] bg-black/15 mx-1"></div>

              <a
                href="https://github.com/Gonablitz"
                target="_blank"
                rel="noreferrer"
                className="px-3.5 py-2 rounded-full border border-black/15 hover:border-[#DC2626] hover:bg-[#DC2626] hover:text-white transition-all duration-300"
              >
                GitHub
              </a>
              <a
                href="https://www.linkedin.com/in/timothy-gona/"
                target="_blank"
                rel="noreferrer"
                className="px-3.5 py-2 rounded-full border border-black/15 hover:border-[#DC2626] hover:bg-[#DC2626] hover:text-white transition-all duration-300"
              >
                LinkedIn
              </a>
              <a
                href="./Timothy_Gona_CV.pdf"
                target="_blank"
                rel="noreferrer"
                className="px-3.5 py-2 rounded-full border border-black/15 hover:border-[#DC2626] hover:bg-[#DC2626] hover:text-white transition-all duration-300"
              >
                CV
              </a>
              <a
                href="https://cal.com/timothy-gona"
                target="_blank"
                rel="noreferrer"
                className="px-4 py-2 rounded-full bg-[#141414] text-white hover:bg-[#DC2626] transition-all duration-300 shadow-md"
              >
                Book Call
              </a>
            </nav>

            {/* Mobile Menu Toggle Button */}
            <button
              onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
              className="lg:hidden p-2 rounded-xl bg-stone-100 border border-black/10 text-[#141414] font-grotesk text-xs uppercase font-bold"

            >
              {mobileMenuOpen ? 'Close ✕' : 'Menu ☰'}

          {/* Mobile Drawer */}

                </div>
              </motion.div>
            )}
          </AnimatePresence>
        </header>
      );
    };

    const ChatWidget = () => {
      const [isOpen, setIsOpen] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [status, setStatus] = useState('idle');
      const [errorMessage, setErrorMessage] = useState('');
      const [formData, setFormData] = useState({ name: '', contact: '', message: '' });

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape' && isOpen) {
            setIsOpen(false);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isOpen]);

      const handleSubmit = (e) => {
        e.preventDefault();
        setErrorMessage('');

        const cleanName = formData.name.trim();
        const cleanContact = formData.contact.trim();
        const cleanMessage = formData.message.trim();

        if (!cleanName || !cleanMessage) {
          setErrorMessage('Please fill in your name and message.');
          return;
        }

        setIsSubmitting(true);
        setStatus('sending');

        setTimeout(() => {
          const text = `Hi Timothy,\n\nName: ${cleanName}\nContact: ${cleanContact || 'Not provided'}\n\nMessage:\n${cleanMessage}`;
          const encodedText = encodeURIComponent(text);
          
          const whatsappUrl = `https://wa.me/254708443570?text=${encodedText}`;
          window.open(whatsappUrl, '_blank');

          setStatus('success');
          setIsSubmitting(false);
          setFormData({ name: '', contact: '', message: '' });
        }, 400);
      };

      return (
        <div className="fixed bottom-6 right-6 z-50 font-inter">
          {!isOpen && (
            <button
              onClick={() => setIsOpen(true)}
              className="flex items-center gap-2 px-5 py-3.5 rounded-full bg-[#141414] text-white font-grotesk text-xs uppercase tracking-wider shadow-2xl hover:bg-[#DC2626] transition-all duration-300"
              aria-label="Open WhatsApp Chat"
            >
              <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
              Chat on WhatsApp
            </button>
          )}

          {isOpen && (
            <div className="w-[320px] sm:w-[380px] bg-white border border-black/15 rounded-3xl shadow-2xl overflow-hidden flex flex-col">
              <div className="bg-[#141414] text-white p-4 flex justify-between items-center border-b border-white/10">
                <div className="flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
                  <span className="font-grotesk text-xs uppercase tracking-widest font-bold">Direct WhatsApp Bridge</span>
                </div>
                <button 
                  onClick={() => setIsOpen(false)} 
                  className="text-stone-400 hover:text-white text-sm w-6 h-6 rounded-full flex items-center justify-center hover:bg-white/10 transition-colors"
                  title="Close (Esc)"
                >
                  ✕
                </button>
              </div>

              <form onSubmit={handleSubmit} className="p-5 space-y-3.5 bg-[#FAFAFA]">
                {errorMessage && (
                  <div className="p-3 bg-red-100 border border-red-300 text-red-800 rounded-xl text-xs font-semibold">
                    ⚠️ {errorMessage}
                  </div>
                )}

                {status === 'success' ? (
                  <div className="p-4 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-2xl text-xs space-y-2">
                    <p className="font-bold">Opening WhatsApp...</p>
                    <p className="text-stone-600">Your message has been pre-filled. Press send inside WhatsApp to dispatch it directly to Timothy.</p>
                    <button
                      type="button"
                      onClick={() => setStatus('idle')}
                      className="mt-2 text-[#DC2626] font-bold underline block"
                    >
                      Send another message
                    </button>
                  </div>
                ) : (
                  <>
                    <div>
                      <label className="block text-[10px] uppercase font-grotesk font-bold text-stone-500 mb-1">Name *</label>
                      <input
                        type="text"
                        placeholder="Your full name"
                        value={formData.name}
                        onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                        className="w-full px-3.5 py-2.5 rounded-xl border border-black/10 text-xs focus:outline-none focus:border-[#DC2626] bg-white"
                      />
                    </div>

                    <div>
                      <label className="block text-[10px] uppercase font-grotesk font-bold text-stone-500 mb-1">Contact Info</label>
                      <input
                        type="text"
                        placeholder="Phone or email"
                        value={formData.contact}
                        onChange={(e) => setFormData({ ...formData, contact: e.target.value })}
                        className="w-full px-3.5 py-2.5 rounded-xl border border-black/10 text-xs focus:outline-none focus:border-[#DC2626] bg-white"
                      />
                    </div>

                    <div>
                      <label className="block text-[10px] uppercase font-grotesk font-bold text-stone-500 mb-1">Message *</label>
                      <textarea
                        placeholder="Type your message here..."
                        rows="3"
                        value={formData.message}
                        onChange={(e) => setFormData({ ...formData, message: e.target.value })}
                        className="w-full px-3.5 py-2.5 rounded-xl border border-black/10 text-xs focus:outline-none focus:border-[#DC2626] bg-white resize-none"
                      ></textarea>
                    </div>

                    <button
                      type="submit"
                      disabled={isSubmitting}
                      className={`w-full py-3 rounded-xl font-grotesk text-xs uppercase tracking-widest font-bold transition-all ${
                        isSubmitting ? 'bg-stone-400 text-stone-200 cursor-not-allowed' : 'bg-[#DC2626] text-white hover:bg-[#141414]'
                      }`}
                    >
                      {isSubmitting ? 'Preparing WhatsApp...' : 'Launch WhatsApp Chat'}
                    </button>
                  </>
                )}
              </form>
            </div>
          )}
        </div>
      );
    };

    const HeroSection = () => {
      return (
        <section className="relative min-h-[90vh] flex flex-col justify-between px-6 md:px-12 pt-8 pb-12 bg-[#FAFAFA] bg-grain border-b border-black/10 overflow-hidden">

              <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-[#DC262650] bg-[#DC26260A] text-[#141414] font-bold">
                <span className="w-1.5 h-1.5 rounded-full bg-[#DC2626] animate-pulse"></span>
                Oracle Vector Search Certified
              </span>
              <span className="text-black/20">/</span>
              <span className="px-3 py-1.5 rounded-full border border-black/10">DataTalks Data Engineering Zoomcamp</span>
              <span className="px-3 py-1.5 rounded-full border border-black/10">PLP Software Dev</span>
            </div>
          </FadeIn>

          <div className="my-auto py-12 z-20 max-w-6xl">
            <FadeIn delay={0.1}>
              <p className="font-grotesk uppercase tracking-widest text-xs sm:text-sm text-[#DC2626] mb-4 font-bold">
                Timothy Gona Muthoni — Systems & AI Engineer
              </p>
            </FadeIn>
            
            <FadeIn delay={0.2}>
              <h1 className="font-kanit font-black uppercase text-[clamp(2.5rem,6.8vw,88px)] leading-[0.92] tracking-tight mb-8 text-[#141414]">
                AI & Data Systems <br />
                <span className="gmt-crimson-gradient">Engineer.</span>
              </h1>
            </FadeIn>

            <FadeIn delay={0.3} className="max-w-2xl mb-10">
              <p className="font-inter text-base sm:text-lg text-[#141414]/80 font-light leading-relaxed">
                Specializing in <strong>Vector Search, RAG Pipelines & Scalable Architecture</strong>, Oracle Vector Search, cloud data pipeline engineering (Terraform, Docker, GCP), and high-throughput full-stack software architectures.
              </p>
            </FadeIn>

            <FadeIn delay={0.4}>
              <div className="flex flex-wrap items-center gap-4 pt-2">
                <a
                  href="#projects"
                  className="px-7 py-4 rounded-full bg-[#DC2626] text-white font-grotesk text-xs uppercase tracking-widest font-bold hover:bg-[#141414] transition-all shadow-lg hover:shadow-xl"
                >
                  View Projects ↓
                </a>
                <a
                  href="#contact"
                  className="px-7 py-4 rounded-full bg-[#141414] text-white font-grotesk text-xs uppercase tracking-widest font-bold hover:bg-[#DC2626] transition-all shadow-md"
                >
                  Hire Me / Contact
                </a>
                <a
                  href="./Timothy_Gona_CV.pdf"
                  target="_blank"
                  rel="noreferrer"
                  className="px-6 py-4 rounded-full border border-black/20 font-grotesk text-xs uppercase tracking-widest font-semibold hover:border-[#DC2626] hover:text-[#DC2626] transition-all"
                >
                  Download CV
                </a>
              </div>
            </FadeIn>
          </div>

          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4 z-20 border-t border-black/10 pt-6 font-grotesk text-xs tracking-wider text-[#141414]/50 uppercase">
            <div>B.Sc. Software Engineering — Kirinyaga University ('28)</div>
            <div>Nairobi, Kenya • +254 708 443 570</div>
          </div>
        </section>
      );
    };

    const MarqueeSection = () => {
      const items = ["ORACLE VECTOR SEARCH", "RAG PIPELINES", "TERRAFORM", "DOCKER", "BIGQUERY", "JAVASCRIPT", "PYTHON", "DBT", "POSTGRESQL", "KAFKA"];
      return (
        <div className="py-5 bg-[#DC2626] text-white font-grotesk font-bold tracking-widest text-sm uppercase overflow-hidden whitespace-nowrap">
          <div className="inline-flex gap-8 animate-marquee">
            {items.concat(items).map((item, idx) => (
              <span key={idx} className="flex items-center gap-8">
                <span>{item}</span>
                <span>•</span>
              </span>
            ))}
          </div>
        </div>
      );
    };

    const AboutSection = () => {
      const strengths = [
        {
          title: "End-to-End Infrastructure",
          desc: "Expertly navigating full engineering lifecycles using Terraform (IaC), Docker, GCP, and modern web application frontends."
        },
        {
          title: "AI & Vector Database Integration",
          desc: "Specialist in enhancing LLM reliability through custom RAG pipelines and high-performance vector search indexes."
        },
        {
          title: "Data Pipeline Architecture",
          desc: "Proficient in workflow orchestration (Mage, Airflow), stream processing (Kafka), and analytics modeling (dbt, BigQuery)."
        },
        {
          title: "Visual Design & UX",
          desc: "Combining technical systems backend with graphic design capabilities (Adobe Creative Suite) for user interfaces."
        }
      ];

      return (
        <section className="px-6 md:px-12 py-24 bg-[#FAFAFA] border-b border-black/10">
          <div className="max-w-7xl mx-auto">
            <FadeIn>
              <span className="font-grotesk text-xs uppercase tracking-widest text-[#DC2626] font-bold">Summary</span>
              <h2 className="font-kanit font-black uppercase text-3xl sm:text-5xl mt-2 mb-12 text-[#141414]">Architectural Strengths</h2>
            </FadeIn>

            <div className="grid md:grid-cols-2 gap-8">
              {strengths.map((item, idx) => (
                <FadeIn key={idx} delay={idx * 0.1}>
                  <div className="p-8 border border-black/10 rounded-2xl bg-white h-full flex flex-col justify-between hover:border-[#DC2626]/50 transition-all">
                    <div>
                      <h3 className="font-grotesk text-xl font-bold text-[#141414] mb-3">{item.title}</h3>
                      <p className="font-inter text-sm text-[#141414]/70 leading-relaxed font-light">{item.desc}</p>
                    </div>
                  </div>
                </FadeIn>
              ))}
            </div>
          </div>
        </section>
      );
    };

    const SkillsSection = () => {
      const skillGroups = [
        {
          category: "Data Engineering",
          tools: ["Docker", "Terraform (IaC)", "Google Cloud Platform (GCP)", "Mage", "Airflow", "dbt", "Apache Spark", "Kafka", "BigQuery"]
        },
        {
          category: "AI & Machine Learning",
          tools: ["Oracle Vector Search", "RAG Pipelines", "Vector Embeddings", "Similarity Search", "Neural Networks", "Model Evaluation"]
        },
        {

          tools: ["JavaScript (Node.js, Express.js)", "Dart", "PHP", "HTML5 & CSS3", "Software Testing", "RESTful APIs"]

            <FadeIn>
              <span className="font-grotesk text-xs uppercase tracking-widest text-[#DC2626] font-bold">Tech Stack</span>
              <h2 className="font-kanit font-black uppercase text-4xl sm:text-5xl mt-2 mb-16 text-[#141414]">Skills & Tools</h2>
            </FadeIn>

            <div className="grid md:grid-cols-2 gap-8">
              {skillGroups.map((group, idx) => (
                <FadeIn key={idx} delay={idx * 0.1}>
                  <div className="p-8 border border-black/10 rounded-3xl bg-white h-full">
                    <h3 className="font-grotesk font-bold text-xl text-[#DC2626] mb-6">{group.category}</h3>
                    <div className="flex flex-wrap gap-2">
                      {group.tools.map((tool, tIdx) => (
                        <span key={tIdx} className="font-inter text-xs px-3 py-1.5 rounded-lg bg-stone-100 border border-black/5 text-[#141414]/80">
                          {tool}
                        </span>
                      ))}
                    </div>
                  </div>
                </FadeIn>
              ))}
            </div>
          </div>
        </section>
      );
    };

    const ProjectsSection = () => {
      const projects = [
        {
          title: "End-to-End Containerized Data Engineering Pipeline",
          domain: "Data Infrastructure & Cloud",
          impact: "Reduced query latency by 40% using optimized dbt transformations while maintaining 99.9% uptime on BigQuery ingestion.",
          bullets: [
            "Architected a containerized data pipeline using Docker and Terraform for automated GCP infrastructure provisioning.",
            "Implemented Mage workflow orchestration to manage ingestion into BigQuery and configured dbt for production data modeling."
          ],
