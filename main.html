<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GMT Studio — Full Stack & Architectural Portfolio</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Kanit:wght@800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            inter: ['Inter', 'sans-serif'],
            grotesk: ['Space Grotesk', 'sans-serif'],
            kanit: ['Kanit', 'sans-serif'],
          },
          colors: {
            crimson: '#DC2626',
            darkBg: '#0C0C0C',
            surfaceText: '#D7E2EA',
          }
        }
      }
    }
  </script>

  <!-- React & Framer Motion CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

  <style>
    /* Custom CSS Overrides */
    body {
      background-color: #0C0C0C;
      color: #D7E2EA;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    .gmt-crimson-gradient {
      background: linear-gradient(135deg, #FFFFFF 0%, #DC2626 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .bg-grain {
      background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
      background-size: 24px 24px;
    }
  </style>
</head>
<body class="bg-[#0C0C0C] text-[#D7E2EA] antialiased selection:bg-[#DC2626] selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useRef, useState, useEffect } = React;
    const { motion, useScroll, useTransform, useInView } = window.Motion;

    // Helper Component: Animated Fade In
    const FadeIn = ({ children, delay = 0, y = 20, className = "" }) => {
      const ref = useRef(null);
      const isInView = useInView(ref, { once: true, margin: "-50px" });

      return (
        <motion.div
          ref={ref}
          initial={{ opacity: 0, y: y }}
          animate={isInView ? { opacity: 1, y: 0 } : { opacity: 0, y: y }}
          transition={{ duration: 0.8, delay: delay, ease: [0.16, 1, 0.3, 1] }}
          className={className}
        >
          {children}
        </motion.div>
      );
    };

    // SECTION 1: HERO SECTION
    const HeroSection = ({ onContactClick }) => {
      return (
        <section className="relative min-h-screen flex flex-col justify-between px-6 md:px-12 pt-12 pb-8 bg-[#0C0C0C] bg-grain border-b border-white/10 overflow-hidden">
          {/* Header Bar */}
          <header className="flex justify-between items-center z-20">
            <div className="font-grotesk font-bold text-2xl tracking-tighter text-white">
              GMT<span className="text-[#DC2626]">.</span>
            </div>
            <button
              onClick={onContactClick}
              className="font-grotesk text-xs uppercase tracking-widest px-5 py-2.5 rounded-full border border-white/20 hover:border-[#DC2626] hover:bg-[#DC2626] hover:text-white transition-all duration-300"
            >
              Get In Touch
            </button>
          </header>

          {/* Center Title Content */}
          <div className="my-auto py-16 z-20 max-w-6xl">
            <FadeIn delay={0.1}>
              <p className="font-grotesk uppercase tracking-widest text-xs sm:text-sm text-[#DC2626] mb-4 font-bold">
                Software Engineering & System Architecture
              </p>
            </FadeIn>
            
            <FadeIn delay={0.2}>
              <h1 className="font-kanit font-black uppercase text-[clamp(2.8rem,9vw,110px)] leading-[0.9] tracking-tight mb-8">
                Building <br />
                <span className="gmt-crimson-gradient">Scalable Digital</span> <br />
                Infrastructure.
              </h1>
            </FadeIn>

            <FadeIn delay={0.3} className="max-w-xl">
              <p className="font-inter text-sm sm:text-base text-[#D7E2EA]/80 font-light leading-relaxed">
                Focused on high-performance web applications, intelligent backend architectures, data pipelines, and sleek frontend systems.
              </p>
            </FadeIn>
          </div>

          {/* Bottom Bar Info */}
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4 z-20 border-t border-white/10 pt-6 font-grotesk text-xs tracking-wider text-[#D7E2EA]/60 uppercase">
            <div>Available for Engineering Roles & Projects</div>
            <div>Based in Nairobi, Kenya</div>
          </div>
        </section>
      );
    };

    // SECTION 2: MARQUEE SECTION
    const MarqueeSection = () => {
      const items = ["REACT", "PYTHON", "SQL", "VECTOR SEARCH", "DUCKDB", "TAILWIND CSS", "NODE.JS", "SYSTEM ARCHITECTURE"];
      return (
        <div className="py-6 bg-[#DC2626] text-white font-grotesk font-bold tracking-widest text-sm uppercase overflow-hidden whitespace-nowrap">
          <div className="inline-flex gap-8 animate-marquee">
            {items.concat(items).map((item, idx) => (
              <span key={idx} className="flex items-center gap-8">
                <span>{item}</span>
                <span>•</span>
              </span>
            ))}
          </div>
        </div>
      );
    };

    // SECTION 3: ABOUT SECTION
    const AboutSection = ({ onContactClick }) => {
      return (
        <section className="px-6 md:px-12 py-24 bg-[#0C0C0C] border-b border-white/10">
          <div className="max-w-7xl mx-auto grid md:grid-cols-12 gap-12 items-center">
            <div className="md:col-span-5">
              <FadeIn>
                <span className="font-grotesk text-xs uppercase tracking-widest text-[#DC2626] font-bold">About GMT Studio</span>
                <h2 className="font-kanit font-black uppercase text-4xl sm:text-5xl mt-2 mb-6 leading-tight">
                  Engineering Precision Meets Aesthetic Cleanliness.
                </h2>
              </FadeIn>
            </div>
            <div className="md:col-span-7 font-inter font-light text-[#D7E2EA]/80 space-y-6 text-base leading-relaxed">
              <FadeIn delay={0.1}>
                <p>
                  I specialize in turning complex software problems into minimal, high-efficiency digital products. With hands-on experience in cloud infrastructure, custom machine learning applications, and full-stack development, every system is crafted with strict performance standards.
                </p>
              </FadeIn>
              <FadeIn delay={0.2}>
                <p>
                  By utilizing modern reactive design frameworks and robust database setups, I construct clean digital spaces that deliver both raw compute power and smooth user experiences.
                </p>
              </FadeIn>
              <FadeIn delay={0.3}>
                <button
                  onClick={onContactClick}
                  className="font-grotesk text-xs uppercase tracking-widest text-white border-b-2 border-[#DC2626] pb-1 hover:text-[#DC2626] transition-colors"
                >
                  Learn More About Work & Services →
                </button>
              </FadeIn>
            </div>
          </div>
        </section>
      );
    };

    // SECTION 4: SERVICES SECTION
    const ServicesSection = () => {
      const services = [
        {
          num: "01",
          title: "Full-Stack Web Engineering",
          desc: "End-to-end frontend and backend development with modern frameworks, focusing on modularity, security, and lightning-fast client interfaces."
        },
        {
          num: "02",
          title: "Data Pipelines & Storage",
          desc: "Constructing analytics pipelines, vector indexing solutions, and lightweight embedded databases designed for real-time querying."
        },
        {
          num: "03",
          title: "UI Architecture & Design Systems",
          desc: "High-contrast visual design systems, scalable component libraries, and stark minimalist aesthetics tailored for digital tools."
        }
      ];

      return (
        <section className="px-6 md:px-12 py-24 bg-[#0C0C0C] bg-grain border-b border-white/10">
          <div className="max-w-7xl mx-auto">
            <FadeIn>
              <span className="font-grotesk text-xs uppercase tracking-widest text-[#DC2626] font-bold">Capabilities</span>
              <h2 className="font-kanit font-black uppercase text-4xl sm:text-5xl mt-2 mb-16">Core Services</h2>
            </FadeIn>

            <div className="grid md:grid-cols-3 gap-8">
              {services.map((srv, idx) => (
                <FadeIn key={idx} delay={idx * 0.15}>
                  <div className="p-8 border border-white/10 rounded-2xl bg-white/[0.02] hover:border-[#DC2626]/50 transition-colors h-full flex flex-col justify-between">
                    <div>
                      <span className="font-grotesk text-2xl font-bold text-[#DC2626]">{srv.num}</span>
                      <h3 className="font-grotesk text-xl font-bold text-white mt-4 mb-3">{srv.title}</h3>
                      <p className="font-inter text-sm text-[#D7E2EA]/70 leading-relaxed font-light">{srv.desc}</p>
                    </div>
                  </div>
                </FadeIn>
              ))}
            </div>
          </div>
        </section>
      );
    };

    // SECTION 5: PROJECTS SECTION
    const ProjectsSection = () => {
      const projects = [
        {
          id: 1,
          name: "Sonic Architect Vault",
          category: "Machine Learning / Audio Processing",
          col1Image: "https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?q=80&w=800&auto=format&fit=crop",
          col2Image: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=1200&auto=format&fit=crop"
        },
        {
          id: 2,
          name: "Vector Query & Analytics Engine",
          category: "Data Engineering & Indexing",
          col1Image: "https://images.unsplash.com/photo-1558494949-ef010cbdcc31?q=80&w=800&auto=format&fit=crop",
          col2Image: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?q=80&w=1200&auto=format&fit=crop"
        }
      ];

      return (
        <section className="px-6 md:px-12 py-24 bg-[#0C0C0C] border-b border-white/10">
          <div className="max-w-7xl mx-auto">
            <FadeIn>
              <span className="font-grotesk text-xs uppercase tracking-widest text-[#DC2626] font-bold">Selected Work</span>
              <h2 className="font-kanit font-black uppercase text-4xl sm:text-5xl mt-2 mb-16">Featured Projects</h2>
            </FadeIn>

            <div className="space-y-16">
              {projects.map((proj) => {
                return (
                  <div key={proj.id} className="group cursor-pointer">
                    <div className="p-6 md:p-8 rounded-[32px] sm:rounded-[48px] bg-[#141414] border border-white/10 hover:border-[#DC2626]/40 transition-all">
                      <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-2">
                        <h3 className="font-grotesk font-bold text-2xl sm:text-3xl text-white group-hover:text-[#DC2626] transition-colors">
                          {proj.name}
                        </h3>
                        <span className="font-grotesk text-xs uppercase tracking-widest text-[#D7E2EA]/50">
                          {proj.category}
                        </span>
                      </div>

                      {/* 2-Column Showcase Layout */}
                      <div className="grid md:grid-cols-12 gap-6 items-stretch">
                        {/* Left Column (40%) - Visual Detail */}
                        <div className="md:col-span-5 overflow-hidden rounded-[24px] sm:rounded-[36px] border border-white/10 h-full min-h-[220px]">
                          <img
                            src={proj.col1Image}
                            alt={`${proj.name} detail view`}
                            className="w-full h-full object-cover transition-transform duration-700 hover:scale-105"
                            loading="lazy"
                          />
                        </div>

                        {/* Right Column (60%) - Hero Showcase Render */}
                        <div className="md:col-span-7 overflow-hidden rounded-[24px] sm:rounded-[36px] border border-white/10 h-full min-h-[220px]">
                          <img
                            src={proj.col2Image}
                            alt={`${proj.name} key render`}
                            className="w-full h-full object-cover transition-transform duration-700 hover:scale-105"
                            loading="lazy"
                          />
                        </div>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </section>
      );
    };

    // SECTION 6: FOOTER / CONTACT SECTION
    const FooterSection = ({ contactRef }) => {
      return (
        <footer ref={contactRef} className="bg-[#0C0C0C] bg-grain text-[#D7E2EA] px-6 md:px-12 py-16 md:py-24 border-t border-white/10 relative z-30">
          <div className="max-w-7xl mx-auto flex flex-col justify-between items-center text-center gap-12">
            
            <FadeIn delay={0} y={30}>
              <h2 className="font-kanit font-black uppercase text-[clamp(2.5rem,8vw,90px)] leading-tight tracking-tight">
                Let&apos;s build something <span className="gmt-crimson-gradient">extraordinary.</span>
              </h2>
            </FadeIn>

            <FadeIn delay={0.15} y={20}>
              <a
                href="mailto:contact@jack3d.com"
                className="font-grotesk font-bold text-xl sm:text-3xl md:text-4xl text-[#DC2626] hover:underline underline-offset-8 transition-all"
              >
                contact@jack3d.com
              </a>
            </FadeIn>

            <div className="w-full flex flex-col md:flex-row justify-between items-center pt-12 border-t border-white/10 font-inter text-xs sm:text-sm text-[#D7E2EA]/60 gap-4">
              <p>© {new Date().getFullYear()} GMT Studio. All rights reserved.</p>
              <div className="flex gap-6 font-grotesk uppercase tracking-wider text-xs">
                <a href="#" className="hover:text-white transition-colors">Twitter / X</a>
                <a href="#" className="hover:text-white transition-colors">Instagram</a>
                <a href="#" className="hover:text-white transition-colors">LinkedIn</a>
              </div>
            </div>

          </div>
        </footer>
      );
    };

    // APP MAIN CONTAINER
    const App = () => {
      const contactRef = useRef(null);

      const scrollToContact = () => {
        contactRef.current?.scrollIntoView({ behavior: 'smooth' });
      };

      return (
        <div className="min-h-screen bg-[#0C0C0C] text-[#D7E2EA] selection:bg-[#DC2626] selection:text-white">
          <HeroSection onContactClick={scrollToContact} />
          <MarqueeSection />
          <AboutSection onContactClick={scrollToContact} />
          <ServicesSection />
          <ProjectsSection />
          <FooterSection contactRef={contactRef} />
        </div>
      );
    };

    // RENDER TO DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
